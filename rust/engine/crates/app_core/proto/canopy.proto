syntax = "proto3";

package pandaengine.networking.canopy.v1;

service CanopyService {
  rpc ResolveTrack(ResolveTrackRequest) returns (ResolveTrackResponse);
  rpc Search(SearchRequest) returns (stream SearchResult);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message ResolveTrackRequest {
  string track_id = 1;
}

message ResolveTrackResponse {
  string source_id = 1;
  string uri = 2;
  optional string mime_type = 3;
  optional uint64 duration_seconds = 4;
}

message SearchRequest {
  string query = 1;
}

message SearchResult {
  string id = 1;
  string title = 2;
  optional string artist = 3;
  optional string album = 4;
  optional string art_uri = 5;
}

message HealthRequest {}

message HealthResponse {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_HEALTHY = 1;
    STATE_REACHABLE = 2;
    STATE_DEGRADED = 3;
  }

  State state = 1;
}
