[package]
name = "panda_engine_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2"
tracing = "0.1"
vosk = { version = "0.3", optional = true }
async-trait = "0.1.89"
anyhow = "1.0.102"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
canopy-api-prost = { package = "pandawave_canopy-api_community_neoeinstein-prost", version = "=0.5.0-00000000000000-145678c1d73e.2", registry = "buf" }
canopy-api-tonic = { package = "pandawave_canopy-api_community_neoeinstein-tonic", version = "=0.5.0-00000000000000-145678c1d73e.4", registry = "buf" }
# Temporary 0.12/0.13 names keep the prototype-generated client compiling until
# its final consumers are replaced by the canonical adapter.
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
tonic-014 = { package = "tonic", version = "=0.14.6", features = ["transport"] }
prost-014 = { package = "prost", version = "0.14" }
prost-types-014 = { package = "prost-types", version = "0.14" }
fastrand = "2"

[dev-dependencies]
mockall = "0.13"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[features]
default = []
vosk-engine = ["vosk"]
