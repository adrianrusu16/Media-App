[package]
name = "media_app_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
vosk = { version = "0.3", optional = true }
async-trait = "0.1.89"
anyhow = "1.0.102"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
fastrand = "2"

[dev-dependencies]
mockall = "0.13"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[features]
default = []
vosk-engine = ["vosk"]
