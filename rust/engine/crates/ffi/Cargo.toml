[package]
name = "panda_engine_ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "panda_engine_ffi"
path = "src/lib.rs"

[dependencies]
panda_engine_core = { package = "media_app_core", path = "../app_core" }
tracing = "0.1"
tracing-subscriber = "0.3"
android_logger = "0.14"
log = "0.4"
tokio = { version = "1", features = ["rt"] }
async-trait = "0.1"
anyhow = "1.0"
