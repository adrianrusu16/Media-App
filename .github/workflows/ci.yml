name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Cargo's buf credential-provider requires an auth scheme. Store the raw BSR
  # token in BUF_TOKEN; this prefix is a no-op when the secret is unset.
  CARGO_REGISTRIES_BUF_TOKEN: "${{ secrets.BUF_TOKEN && format('Bearer {0}', secrets.BUF_TOKEN) || '' }}"
  PANDA_ENGINE_ANDROID_NDK_VERSION: 30.0.14904198
  RUST_TOOLCHAIN: "1.97.1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-fast:
    name: Android fast validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Scan for Canopy secrets and private infrastructure
        run: |
          set +e
          rg --file config/canopy-secret-patterns.txt \
            app core feature rust scripts .github config \
            --glob '!**/testdata/**' \
            --glob '!config/canopy-secret-patterns.txt'
          scan_status=$?
          set -e
          if [ "$scan_status" -eq 0 ]; then
            echo "Canopy secret or private-infrastructure pattern detected"
            exit 1
          fi
          if [ "$scan_status" -ne 1 ]; then
            exit "$scan_status"
          fi

      - name: Enforce Canopy wire-type boundary
        run: |
          set +e
          rg -n 'canopy_api_|canopy::v1|canopy::sdk|networking::canopy::sdk' app core feature rust/engine/crates/app_core/src --glob '!rust/engine/crates/app_core/src/networking/canopy/**'
          scan_status=$?
          rg -n 'pub(\(crate\))?[[:space:]]+mod[[:space:]]+sdk' rust/engine/crates/app_core/src/networking/canopy/mod.rs
          visibility_status=$?
          set -e
          if [ "$scan_status" -eq 0 ]; then
            echo "Canopy wire type leaked outside the adapter boundary"
            exit 1
          fi
          if [ "$visibility_status" -eq 0 ]; then
            echo "Canopy SDK module is visible outside its adapter"
            exit 1
          fi
          if [ "$scan_status" -ne 1 ]; then
            exit "$scan_status"
          fi
          if [ "$visibility_status" -ne 1 ]; then
            exit "$visibility_status"
          fi

      - name: Quality, lint, and test
        run: >
          ./gradlew
          qualityCheck
          :app:lintRelease
          test
          -PpandaEngine.buildNative=false
          -Ppandawave.verificationAppLinkHost=ci.pandawave.dev
          --console=plain

  android-debug:
    name: Android debug native
    needs: android-fast
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36.1" "ndk;$PANDA_ENGINE_ANDROID_NDK_VERSION"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-linux-android

      - name: Cache Android debug Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/engine/target
          key: cargo-android-debug-x86_64-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-ndk-${{ env.PANDA_ENGINE_ANDROID_NDK_VERSION }}-${{ hashFiles('rust/engine/Cargo.lock', 'rust/engine/Cargo.toml') }}-${{ hashFiles('rust/engine/crates/**') }}
          restore-keys: |
            cargo-android-debug-x86_64-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-ndk-${{ env.PANDA_ENGINE_ANDROID_NDK_VERSION }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug with one ABI
        run: >
          ./gradlew
          :app:assembleDebug
          -PpandaEngine.debugAbis=x86_64
          --console=plain

  android-release:
    name: Android release validation
    needs: android-fast
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/heads/release')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36.1" "ndk;$PANDA_ENGINE_ANDROID_NDK_VERSION"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache Android release Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/engine/target
          key: cargo-android-release-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-ndk-${{ env.PANDA_ENGINE_ANDROID_NDK_VERSION }}-${{ hashFiles('rust/engine/Cargo.lock', 'rust/engine/Cargo.toml') }}-${{ hashFiles('rust/engine/crates/**') }}
          restore-keys: |
            cargo-android-release-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-ndk-${{ env.PANDA_ENGINE_ANDROID_NDK_VERSION }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble release and benchmark
        run: >
          ./gradlew
          :app:assembleRelease
          :app:assembleBenchmark
          -Ppandawave.verificationAppLinkHost=ci.pandawave.dev
          --console=plain

  rust:
    name: Rust validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: rust/engine

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache host Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/engine/target
          key: cargo-host-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/engine/Cargo.lock', 'rust/engine/Cargo.toml') }}-${{ hashFiles('rust/engine/crates/**') }}
          restore-keys: |
            cargo-host-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Verify immutable Canopy SDK compatibility
        shell: pwsh
        working-directory: .
        run: ./scripts/verify-canopy-sdk.ps1

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

  connected:
    name: MediaBrowser smoke (emulator)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: MediaBrowser connected smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >
            ./gradlew
            :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.adrianrusu.pandawave.BambooMediaBrowserSmokeTest
            -PpandaEngine.buildNative=false
            --console=plain
